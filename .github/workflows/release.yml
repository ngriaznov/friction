name: Release

# Triggered by a push to main, not by a tag: the version in
# crates/friction-cli/Cargo.toml is the single source of truth, and this
# workflow derives and creates the tag from it. Tagging by hand would mean
# every release needs someone to remember to do it, and to get it right.
#
# A push whose version already has a tag is a no-op that still reports
# green, so an ordinary commit does not fail the workflow or publish a
# duplicate release. To cut a release: bump the version, push.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        run: |
          version=$(grep -m1 '^version' crates/friction-cli/Cargo.toml | cut -d '"' -f2)
          if [ -z "$version" ]; then
            echo "could not read a version from crates/friction-cli/Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved version $version"

      - id: tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.read.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.read.outputs.version }} is already tagged; nothing to release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.read.outputs.version }} is new; will build and release"
          fi

  # The test gate: no binary is built and nothing is tagged or published
  # unless the whole workspace suite passes on the release commit itself.
  # CI runs the same suite in parallel on every push, but a parallel
  # workflow cannot *block* this one — only a `needs` edge can. Scoped to
  # release pushes (`should_release`), so the ordinary-commit no-op path
  # stays a two-step version check.
  test:
    name: test gate
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Builds the playground tarball alongside the native matrix (both need
  # only the test gate, not each other) so it lands in `dist` in time for
  # the release job's single upload step.
  wasm:
    name: wasm playground
    needs: [version, test]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # web/pkg/package.json (wasm-pack stamps it from this crate's own
      # `version`) is what web/loader.js reads to pin its GitHub-raw pack
      # fetch to `v{version}` — but the release tag itself (`needs.version`,
      # above) is derived only from crates/friction-cli/Cargo.toml. Nothing
      # else keeps the two in lockstep, so a release that bumps one without
      # the other would silently ship a playground build pointed at the
      # wrong tag. Checked before the (slow) wasm-pack install/build below.
      - name: assert friction-wasm's version matches the release version
        run: |
          version="${{ needs.version.outputs.version }}"
          wasm_version=$(grep -m1 '^version' crates/friction-wasm/Cargo.toml | cut -d '"' -f2)
          if [ "$wasm_version" != "$version" ]; then
            echo "crates/friction-wasm/Cargo.toml's version ($wasm_version) does not match" >&2
            echo "the release version ($version, from crates/friction-cli/Cargo.toml)." >&2
            echo "web/pkg/package.json would pin the playground's pack fetch to" >&2
            echo "v$wasm_version, not this release's tag v$version. Bump" >&2
            echo "crates/friction-wasm/Cargo.toml's version to match before releasing." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: build
        run: wasm-pack build crates/friction-wasm --release --target web --out-dir ../../web/pkg

      - name: package
        run: |
          version="${{ needs.version.outputs.version }}"
          name="friction-playground-$version"
          tar czf "$name.tar.gz" -C web .
          shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          mkdir -p dist
          mv "$name.tar.gz" "$name.tar.gz.sha256" dist/
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-playground
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: [version, test]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runners are arm64, so the x86_64 build is a cross-compile.
          # Both work without extra tooling: the crate tree is pure Rust
          # (flate2 on miniz_oxide, no cc/bindgen), so there is no C
          # toolchain to arrange per target.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # A statically linked Linux binary, for CI images and containers
          # that should not care about the host's glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install cross-compilation packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: build
        shell: bash
        run: |
          if [ -n "${{ matrix.linker }}" ]; then
            target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
            export "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}"
          fi
          cargo build --release --locked -p friction-cli --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          name="friction-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/friction.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/friction" "dist/$name/"
            # Strip on native builds only: the host `strip` does not
            # understand a foreign object file, and a failed strip should
            # not fail a release.
            strip "dist/$name/friction" 2>/dev/null || true
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
            certutil -hashfile "$name.zip" SHA256 | sed -n 2p > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" | cut -d' ' -f1 > "$name.tar.gz.sha256"
          fi
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: publish v${{ needs.version.outputs.version }}
    needs: [version, build, wasm]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The data artifacts compiled into every binary, published standalone
      # so they can be fetched, cached, and verified independently (the
      # sidecars and headers already carry source sha256 provenance), the
      # groundwork for non-embedded consumers such as a wasm build.
      - name: Stage data artifacts
        run: |
          v="${{ needs.version.outputs.version }}"
          for f in crates/friction-nlp/weights/parser_en.bin \
                   crates/friction-nlp/weights/perceptron_en.bin \
                   crates/friction-packs/packs/jargon-attest-en-v1.bin \
                   crates/friction-packs/packs/dms-index-en-v1.bin; do
            name="friction-data-${v}-$(basename "$f")"
            cp "$f" "dist/$name"
            shasum -a 256 "dist/$name" | cut -d' ' -f1 > "dist/$name.sha256"
          done
          cp crates/friction-packs/packs/jargon-attest-en-v1.toml \
            "dist/friction-data-${v}-jargon-attest-en-v1.toml"

      - run: ls -l dist

      # Creates the tag as well as the release, which is why nothing tags
      # by hand.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            Prebuilt `friction` binaries. Download the archive for your platform,
            extract, and put `friction` on your `PATH`.

            Each archive carries a `.sha256` alongside it.

            The `friction-data-*` assets are the weight and attestation
            artifacts compiled into every binary, published standalone for
            independent verification and for consumers that load them at
            runtime instead of embedding them. Their formats and source
            provenance are documented in the repository
            (`crates/friction-nlp/weights/NOTICE.md`, the pack sidecars).

            The `friction-playground-*.tar.gz` asset is the WebAssembly
            playground: a static site (`index.html`, `pkg/`) that runs the
            same engine in a browser. Extract it and serve the directory
            with any static file server. See `docs/WASM.md` for how it
            works and where the models come from.

            **macOS:** these binaries are unsigned, so Gatekeeper will refuse the
            first run. Either `xattr -cr ./friction` or right-click → Open once.

            **Which Linux build:** `musl` is statically linked and does not care
            about the host's glibc — prefer it for containers and CI images.
            `gnu` is the ordinary dynamically linked build.

  npm:
    name: publish friction-cli to npm
    needs: [version, build, release]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets `npm publish --provenance` attest that these tarballs were built
      # by this workflow from this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 (bundled from Node 24) is what trusted publishing
          # needs; Node 20's npm 10 cannot mint the OIDC exchange.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Publishing is opt-in, in one of two modes, and the job reports green
      # and does nothing when neither is configured, so the binary release
      # above is never held hostage to npm credentials:
      #
      # - trusted: the NPM_TRUSTED_PUBLISHING repository variable is "true"
      #   and every package has this workflow registered as its trusted
      #   publisher on npmjs.com (package settings -> Trusted Publisher ->
      #   GitHub Actions: owner ngriaznov, repository friction, workflow
      #   filename release.yml). No stored token: npm exchanges the job's
      #   OIDC token for a short-lived credential and attaches provenance
      #   itself. A fresh registration expires unless its first publish
      #   succeeds within two days.
      # - token: the NPM_TOKEN secret holds a granular access token. These
      #   expire (the Nov 2026 refresh died on a 404 from an expired one,
      #   a month after the same token published 0.6.18), and npm removes
      #   direct publishing with them in January 2027 — the trusted mode
      #   is the one to keep.
      - id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "publishing via trusted publishing (OIDC)"
          elif [ -n "$NPM_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "publishing with the NPM_TOKEN secret"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "neither NPM_TRUSTED_PUBLISHING nor NPM_TOKEN is set; skipping npm publish"
          fi

      - if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - name: extract archives and build packages
        if: steps.gate.outputs.publish == 'true'
        run: |
          mkdir -p dist npm-dist
          cd archives
          # friction-playground-*.tar.gz is the wasm playground site, not a
          # platform binary — nothing in it belongs in an npm package.
          for f in *.tar.gz; do
            case "$f" in friction-playground-*) continue ;; esac
            tar xzf "$f" -C ../dist
          done
          for f in *.zip; do unzip -qo "$f" -d ../dist; done
          cd ..
          node npm/build.mjs "${{ needs.version.outputs.version }}" dist npm-dist

      # Platform packages first. The wrapper declares exact-version optional
      # dependencies on them, so publishing it first would leave a window where
      # `npm install friction-cli` resolves a wrapper whose binaries do not yet
      # exist on the registry.
      - name: publish
        if: steps.gate.outputs.publish == 'true'
        env:
          # Token mode authenticates with the secret. Trusted mode must not
          # see a real token at all: setup-node's placeholder value is what
          # lets npm fall through to the OIDC exchange, so the secret (which
          # may be set and expired) is kept out of the environment there.
          NODE_AUTH_TOKEN: ${{ steps.gate.outputs.mode == 'token' && secrets.NPM_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX' }}
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          # Trusted publishing attaches provenance on its own; the explicit
          # flag is the token path's.
          provenance=""
          [ "$MODE" = "token" ] && provenance="--provenance"
          # Platform packages are scoped, so they live one level deeper
          # than the wrapper: npm-dist/@scope/name. Unscoped sibling names
          # (friction-cli-darwin-arm64 and friends) tripped npm's spam
          # heuristic, which is what a run of near-identical unscoped names
          # looks like to it.
          for pkg in npm-dist/@*/*; do
            echo "publishing $(node -p "require('./$pkg/package.json').name")"
            (cd "$pkg" && npm publish $provenance --access public)
          done
          echo "publishing friction-cli"
          (cd npm-dist/friction-cli && npm publish $provenance --access public)
