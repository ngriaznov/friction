[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ngriaznov/friction"

[workspace.dependencies]
thiserror = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
proptest = "1"
ureq = { version = "3", features = ["json"] }
walkdir = "2"
# Deterministic, non-cryptographic hashing used to seed the fix-strategy
# PRNG from (sentence bytes, rule id) — see `friction-rules::StrategyRng` —
# and, with a fixed seed, to hash `jargon-attest-v1`'s normalized compound
# keys into the `u64`s its `BinaryFuse8` filter is built over
# (`friction-packs::jargon_attest`).
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# Binary fuse filter for `jargon-attest-v1`'s web-scale compound
# attestation table (`friction-packs::jargon_attest`). `default-features =
# false` drops the `uniform-random` feature (and its `rand`/`getrandom`
# transitive deps), which this workspace never needs: keys are hashed
# deterministically by this workspace's own `xxhash-rust`, not sampled.
# `binary-fuse` (pulls in `libm` only) is the one filter family this
# workspace uses. Pinned to the `0.12` line; bump deliberately.
xorf = { version = "0.12", default-features = false, features = [
    "binary-fuse",
] }
# Literal automaton for the short single-word/phrase tells the DMS channel
# has no match-length signal for (friction-match's literal channel).
# Already present transitively via `regex`; promoted to a direct,
# version-pinned dependency here.
aho-corasick = "1"
# End-to-end CLI snapshot suite (friction-cli's tests/snapshot.rs): pins
# the full byte output of `check`/`fix`/`explain` over a fixed corpus
# selection to on-disk `.snap` files.
insta = "1"
# Work-stealing data parallelism for the embarrassingly-parallel
# per-sentence NLP work (tagging, parsing, per-family/per-channel scans) —
# `friction-edit`'s register pass, `friction-cli`'s `fix`/`check`. Ordered
# `par_iter().collect()`/`join`/`scope` only, never an unordered
# `for_each`: every parallel site is required to produce byte-identical
# output regardless of thread count (see `friction-edit`'s own
# `rayon_determinism` test). Pinned to the `1.12` line; bump deliberately.
rayon = "1.12"
# Seedless, deterministic `FxHash` — the hasher rustc itself uses for its
# internal maps. Used where a `HashMap` is on a hot lookup path and
# std's default SipHash's DoS-resistance is paid for nothing (these
# keys are never attacker-controlled): `friction-match`'s per-scan
# interner-id lookup and `friction-nlp`'s irregular-verb-base lookup.
# Deliberately not `ahash`/`foldhash`: both randomly seed by default,
# which would make map iteration order (and anything derived from it)
# vary run to run — this workspace's reproducibility doctrine requires
# every hash used in a hot path to be seedless and fixed.
rustc-hash = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Targeted allows: these pedantic/nursery lints fire on idiomatic code more
# often than they catch real issues in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Thin LTO + single codegen unit: measured ~10% off fix's runtime for
# slower release builds, the right trade for a shipped CLI. panic stays
# "unwind": friction-parse's catch_unwind guard around pulldown-cmark's
# known panic (see its module docs) must keep working.
[profile.release]
lto = "thin"
codegen-units = 1
