[package]
name = "friction-harness"
version = "0.1.0"
description = "Fixture-driven scoring harness pinning the engine against validated accept/reject cases."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
friction-core = { path = "../friction-core" }
friction-parse = { path = "../friction-parse" }
friction-nlp = { path = "../friction-nlp" }
friction-metrics = { path = "../friction-metrics" }
friction-packs = { path = "../friction-packs" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Not yet in [workspace.dependencies]; added directly here per this
# workspace's existing crate-local convention (see friction-metrics's own
# Cargo.toml): used only for the seed tell-span/pivot pattern tables. No
# lookaround is required by any pattern transcribed into src/tellspan.rs or
# src/pivot.rs.
regex = "1"

[dev-dependencies]
# `tests/engine_fixtures.rs` drives the real engine for byte-exact
# fixture assertions now that one exists; see that crate's own header
# comment for why this dev-dependency (this crate -> friction-edit) is
# not a build-graph cycle even though friction-edit's own dev-dependency
# on corpus-tool eventually reaches back to this crate as a normal
# dependency (corpus-tool -> friction-harness): dev-dependencies are
# only needed to build test binaries, never a library target itself.
friction-edit = { path = "../friction-edit" }
