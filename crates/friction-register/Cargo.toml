[package]
name = "friction-register"
version = "0.1.0"
description = "Register measurement and the two rephrasing transducers the parser supports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## Forwards to `friction-nlp/embedded-weights` — see friction-metrics'
## Cargo.toml for why this exists (same wasm-dependency-closure reason).
default = ["friction-nlp/embedded-weights"]

[dependencies]
friction-core = { path = "../friction-core" }
friction-nlp = { path = "../friction-nlp", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
friction-parse = { path = "../friction-parse" }
serde_json = { workspace = true }
