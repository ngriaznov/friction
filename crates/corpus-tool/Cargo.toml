[package]
name = "corpus-tool"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Path deps, not in workspace.dependencies (only this crate and the crates
# they belong to need them): `envelope`/`separate` parse corpus docs and
# compute their MetricVector via `friction-metrics` (see
# `src/metric_source.rs`), which in turn needs `friction-nlp`'s segmenter
# and tagger to hand `friction-metrics::compute` a fully-segmented,
# tagger-ready document.
friction-core = { path = "../friction-core" }
# `attest --calibrate-near-noop` runs the real repair engine over every
# TRAIN (and, once, DEV) human doc to measure the natural pivot rate a
# stage-1 (no `[near_noop]` table) attestation pack allows.
friction-edit = { path = "../friction-edit" }
# `mine-inventory` reuses the canonical clean/tokenize/split_sentences
# primitives and the relocated `friction_nlp::lvc` tables (transitively)
# from this crate rather than re-implementing them.
friction-harness = { path = "../friction-harness" }
friction-metrics = { path = "../friction-metrics" }
friction-nlp = { path = "../friction-nlp" }
# `index` builds `friction_packs::dms::ModelFamily`-keyed streams; parsing
# them back into a `Sam`/`DmsIndex` is this crate's job only for
# `--calibrate` reporting (deferred — see `commands::index`'s docs).
friction-packs = { path = "../friction-packs" }
friction-parse = { path = "../friction-parse" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Not in workspace.dependencies; pinned here per crate-local convention for
# a dependency the workspace root doesn't otherwise need. `separate_holdout`
# uses this (not just tests) to hold each llm-holdout doc's release-binary
# fixed output in a scratch directory for the duration of one run.
tempfile = "3"
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true
walkdir.workspace = true
