# register-v1 pack: per-1000-prose-word human rate bands for the four
# register features friction-register's transducers home toward
# (nominalization, agentless_passive, em_dash, semicolon).
#
# Measured from class:human, split:train, genre:docs (58 documents, the
# same train-split docs population envelope-v2 records under
# `pack.human_docs_per_genre.docs`). Each band is the 10th and 90th
# percentile of the per-document rate across those 58 documents; `median`
# is the per-document median, carried for reference only — see
# `friction-edit`'s register module for why termination targets the band,
# not the median.
#
# `readme` is deliberately excluded from the measurement population: it
# registered as a genuinely different register from `docs` in the same
# train-split measurement pass envelope-v2 draws from, and pooling the two
# would blur both. This mirrors envelope-v2's own per-genre banding, one
# level narrower (four hand-picked features instead of the full metric
# vector).
#
# `em_dash` was measured with `corpus-tool register-bands`, through the
# real `friction-edit::register::measure_em_dash_rate` runtime path (the
# other two features predate that tool and were transcribed from the
# research-phase Python port instead — see `docs/research/regvec/`). 56 of
# the 58 documents contain zero em dashes (U+2014) at all; the two that
# don't measure 1.1031 and 1.5385 per 1000 prose words. The 10th
# percentile, median, *and* 90th percentile all land on a zero-rate
# document, so every bound below is exactly 0.0 -- not rounded, not a
# floor substituted for a genuine zero. That is the correct reading of the
# population, not a measurement failure: em dashes are effectively absent
# from human docs-genre technical writing, so this band drives the
# register pass to remove every em dash it can license a rewrite for,
# rather than merely reduce their rate toward some nonzero target.
#
# `semicolon` was measured the same way, over the same 58-document
# population, through `friction-edit::register::measure_semicolon_rate`.
# Unlike em_dash, this population is not near-degenerate: 29 of the 58
# documents contain zero semicolons, but the other 29 do not, and the
# distribution's upper half is spread widely enough that the 90th
# percentile lands on a genuinely nonzero rate, 3.6563 per 1000 prose
# words (max observed: 9.0909). The 10th percentile and the median both
# still land on a zero-rate document -- coincidentally the same shape as
# em_dash's low/median bounds -- but `high` is not zero, so this band is
# not degenerate the way em_dash's is. That shape is the point: human
# technical prose legitimately uses semicolons, so `register.semicolon`
# only fires on a document whose rate sits *above* 3.6563 (a measured
# Claude-family tell: a real Claude README ran 6.4 per 1000 prose words),
# and it stops as soon as the rate re-enters [0.0, 3.6563] -- never
# driving a document's semicolon rate toward zero the way `em_dash` does,
# and leaving a document already inside the band byte-identical.

[pack]
version = "register-v1"
measured_from = "class:human, split:train, genre:docs"
sample_doc_count = 58
excluded_genres = ["readme"]
band_method = "10th/90th percentile of per-document rate, per 1000 prose words"

[features.nominalization]
low = 15.4669
high = 50.5606
median = 28.2129

[features.agentless_passive]
low = 5.4253
high = 21.4870
median = 11.7342

[features.em_dash]
low = 0.0
high = 0.0
median = 0.0

[features.semicolon]
low = 0.0
high = 3.6563
median = 0.0

# `contrast_closer` was measured with the same `corpus-tool
# register-bands` run over the same 58-document population, through
# `friction-edit::register::measure_contrast_closer_rate`. The feature
# counts the see-saw closers "rather than" and ", not " -- corpus-wide
# they measure 8.5x and 5.0x machine-tilted respectively, but 43 of the
# 58 human docs still use at least neither and the 90th percentile lands
# at 1.8382 per 1000 prose words (max observed: 6.7416): humans genuinely
# reach for the construction, machines lean on it. Mostly still detect-
# only: deleting the negative half of a contrast can delete real
# instructional content ("use A rather than B"), so most above-band
# instances still surface as a held finding. Two narrow sentence-final
# tail shapes are the exception -- T10 (`friction_register::transduce::
# t10_contrast_tail`) deletes a sentence-final ", not <tail up to 5
# tokens>." or "rather than <tail up to 5 tokens>." outright, each
# measured well below this band's own edge and licensed only when the
# rest of the sentence still stands on its own after the deletion.
[features.contrast_closer]
low = 0.0
high = 1.8382
median = 0.0

# `past_progressive` was measured the same way, and the population is
# near-degenerate the same way em_dash's is: 57 of the 58 human docs
# contain zero adjacent was/were+VBG pairs at all; the one that doesn't
# measures 0.9191. The 10th percentile, median, and 90th percentile all
# land on zero-rate documents, so every bound is exactly 0.0 -- the
# correct reading, not a failure: docs-genre human technical writing
# states past events in the simple past, and the progressive-softening
# tell (2.4x corpus-wide) is machine register almost outright. Like
# em_dash, this band drives T9 to remove every progressive it can
# license, with the temporal-frame and copular-VBG declines carrying the
# meaning-safety load.
[features.past_progressive]
low = 0.0
high = 0.0
median = 0.0
