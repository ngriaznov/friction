# --------------------------------------------------------------------
# Attested exceptions: exact compounds never flagged regardless of the
# filter below.
#
# As of the jargon-attest-v1 filter (friction_packs::JargonAttestPack, a
# BinaryFuse8 over ~2M normalized Wikipedia-title/OpenAlex-topic compound
# keys — see that pack's own sidecar and SYNTHESIS.md §4), THE FILTER is
# this channel's attestation oracle, not this list. Every entry formerly
# here that the filter itself already attests as a real Wikipedia title —
# "data fabric", "resonance frequency", "resonant frequency", "wave
# resonance", "oil well", "water well", "primordial soup", "color
# harmony" — has been pruned: keeping a redundant hand-curated entry next
# to a table that already covers it is a maintenance liability, not
# defense in depth. What remains below is only what the filter MISSES
# (checked against the raw jargon-attest-v1 input data, not merely
# asserted) and that still has a defensible technical-context reason.
#
# Two entries were removed outright rather than pruned-as-redundant:
# "tile mosaic" (a camera color-filter pattern) and "hot soup" (food
# safety) were both literal-usage false positives from a full-corpus
# precision sweep, but both were found in genuinely out-of-scope prose
# (a cooking post, a camera-hardware post) — friction targets technical
# documentation, and carving out literal senses for out-of-scope genres
# is the wrong mechanism (it would grow this list without bound as more
# non-technical false positives surface). Flagging "tile mosaic"/"hot
# soup" in that kind of document is now ACCEPTED behavior, not excepted:
# a full-corpus human sweep re-flagging those one or two documents is
# expected and correct, not a regression.
# --------------------------------------------------------------------

[[attested_exceptions]]
compound = "service fabric"
notes = "Product-adjacent, established (Azure Service Fabric and the general distributed-systems sense predate LLM prose). Not a jargon-attest-v1 filter hit (not a Wikipedia title, not an OpenAlex topic) — kept here because it's a real, defensible technical term the filter's two sources happen to miss."

[[attested_exceptions]]
compound = "test well"
notes = "Literal well (an exploratory drilled shaft), not the metaphor sense. Not a jargon-attest-v1 filter hit (unlike \"oil well\"/\"water well\", both now filter-attested and pruned from this list) — kept here as a defensible literal-sense override in technical (drilling/exploration) context."

