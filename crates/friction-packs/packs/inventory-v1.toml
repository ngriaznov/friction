# --------------------------------------------------------------------
# Licensed light-verb/nominalization pairs. Counts are measured fresh
# against the current TRAIN corpus by `mine-inventory`'s LVC section
# (see corpus/MINE_INVENTORY.md). As that report states plainly: these
# counts do NOT currently reproduce any historical aggregate-rate
# figure, and license = false for all but one pair under the
# within-class test (constr_M > verb_M and verb_H > constr_H) on this
# corpus. All entries are retained anyway - their validation was at the
# construction level (hand-built positive/negative test cases), never
# corpus-rate-based, and this milestone's brief is explicit that
# re-deriving or re-validating them from today's corpus is out of
# scope. `light_verb_base` records the most idiomatically natural of
# the four licensed light verbs (perform | conduct | make | do) for
# each pair as a curator annotation; the runtime match and this
# section's own measurement both scan all four light verbs for every
# pair regardless of this field.
#
# Note on count: friction_nlp::lvc::DERIVATIONAL_LEXICON actually holds
# 31 entries, not the 30 this milestone's brief states throughout - the
# doc comment on that table itself over-counts by one. All 31 real
# entries are transcribed below; see corpus/MINING_V2.md.
# --------------------------------------------------------------------

