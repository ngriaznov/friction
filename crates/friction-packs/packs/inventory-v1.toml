# inventory-v1 pack: the curated tell-span inventory (deletion spans,
# substitution pairs, ritual frames, a preview-frame rule slot, licensed
# light-verb-construction pairs, and guard-token closed classes).
#
# This file is NOT machine-generated. `corpus-tool mine-inventory` writes
# a markdown report only (see `mine_inventory_report_path` below); every
# entry in this file was hand-transcribed and hand-reviewed from that
# report by a human curator. Re-running `mine-inventory` does not
# overwrite this file.
#
# Provenance: `corpus-tool mine-inventory --corpus-dir corpus --report
# corpus/MINE_INVENTORY.md`, train split only, pooled across all five
# genres (264 human docs / 230 llm docs), default thresholds (eps=0.4,
# min_human_token_freq=25, min_machine_count n2/n3/n4=8/5/4, skeleton
# pass on). Two independent runs produced byte-identical report output
# (see `corpus/MINING_V2.md` for the determinism check).
#
# A second provenance round layered on top of the above: `corpus-tool
# mine-paired --corpus-dir corpus --paired-dir corpus/paired --report
# corpus/MINE_PAIRED.md`, over the stock/antislop paired mining corpus
# (`corpus/paired/`, 55 pairs / 110 docs, never manifest-tracked, never
# split - see `commands::generate_paired`'s own module docs), default
# thresholds (eps=0.4, min_antislop_token_freq=8, min_stock_count
# n2/n3/n4=8/5/4). Because both sides of every pair answer the identical
# prompt under the identical derived seed, this pass cancels topic at
# the per-prompt level and lets a curator see genuinely stylistic
# machine-register tells that pooled machine-vs-human mining (above)
# couldn't confirm - see `corpus/MINING_V2.md` §8 for the full
# admitted/rejected list, counts, and the determinism check (two
# independent runs, byte-identical report).
#
# `source` on every entry is one of:
#   "seed"          - transcribed verbatim from the pre-existing runtime
#                     inventory (`friction-harness::tellspan`'s RITUAL/
#                     SUBS/SPANS statics, or `friction-nlp::lvc`'s
#                     DERIVATIONAL_LEXICON); not re-derived from this
#                     corpus.
#   "mined"         - passed the mine-inventory pipeline's own thresholds
#                     (or, for the block-position families, was judged
#                     against the raw ungated counts the report provides
#                     for exactly that purpose) and was then hand-
#                     approved here.
#   "mined-paired"  - passed the mine-paired pipeline's stock/antislop
#                     ratio-threshold gate (topic-cancelled by
#                     construction - see above) and was then hand-
#                     approved here; every substitution replacement is
#                     still grep-verified against the human TRAIN corpus
#                     the same way "curated-seed" entries are, with the
#                     counts recorded in `notes`.
#   "curated-seed"  - failed the mining thresholds (almost always because
#                     a constituent word is too rare on this corpus to
#                     clear the human-frequency gate) but is added by
#                     hand anyway, with the exact counts that failed the
#                     gate recorded in `notes` so the decision is
#                     auditable.
#
# `repair` on every deletion_spans/substitution_pairs/ritual_frames entry
# is one of "delete", "substitute", or "diagnostic_only" (the last marks
# an entry that is recorded for honesty but has no safe closed-set
# rewrite and must not be executed as a rewrite rule).
#
# Curation of literal machine-favored n-grams rejected a long list of
# corpus-topic artifacts that happen to be specific to this corpus's
# generation prompts or human source documents, not general llm-vs-human
# register (mirrors the same discipline `mined-ngrams-v1.toml` already
# documents for the discriminative-mining pack) - see
# `corpus/MINING_V2.md` for the full rejected list with counts and
# per-entry reasons (both the mine-inventory round and the mine-paired
# round).
mine_inventory_report_path = "corpus/MINE_INVENTORY.md"
mine_paired_report_path = "corpus/MINE_PAIRED.md"

[pack]
version = "inventory-v1"
corpus_manifest_sha256 = "001d33df8d362ee94ffd2d8e0fcdf811fd4ce1de34cd909a7d852793a34b6969"
paired_manifest_sha256 = "c67c42b15e19bf6a152fefd9e835694ae509b95585591c26cffe238668a0c9fa"

# --------------------------------------------------------------------
# Gated span deletion (whole-match removed, no replacement text).
# `anchor` is "sentence_initial" (pattern requires `^`), "mid_sentence"
# (no positional anchor), or "trailing" (pattern requires the sentence's
# end) - the third value isn't in the original three-way design sketch
# but is the honest description of `span.to_suit_your_needs_trailing`'s
# actual regex, and nothing parses this field yet (see the pack-swap
# deferral note below), so it costs nothing to be precise here.
# --------------------------------------------------------------------

[[deletion_spans]]
id = "span.by_following_these_steps_leading"
pattern = '(?i)^by following these steps,?\s+'
anchor = "sentence_initial"
repair = "delete"
source = "seed"

[[deletion_spans]]
id = "span.it_is_important_to_note_that_leading"
pattern = '(?i)^it is important to note that\s+'
anchor = "sentence_initial"
repair = "delete"
source = "seed"

[[deletion_spans]]
id = "span.it_is_important_to_note_that_mid"
pattern = '(?i)\bit is important to note that\s+'
anchor = "mid_sentence"
repair = "delete"
source = "seed"

[[deletion_spans]]
id = "span.its_worth_noting_that_leading"
pattern = "(?i)^it'?s worth noting that\\s+"
anchor = "sentence_initial"
repair = "delete"
source = "seed"

[[deletion_spans]]
id = "span.please_note_that_leading"
pattern = '(?i)^please note that\s+'
anchor = "sentence_initial"
repair = "delete"
source = "seed"

[[deletion_spans]]
id = "span.quickly_and_easily"
pattern = '(?i)\bquickly and easily\s+'
anchor = "mid_sentence"
repair = "delete"
source = "seed"

[[deletion_spans]]
id = "span.simply"
pattern = '(?i)\bsimply\s+'
anchor = "mid_sentence"
repair = "delete"
source = "seed"

[[deletion_spans]]
id = "span.to_suit_your_needs_trailing"
pattern = '(?i)\s+to suit your needs\b'
anchor = "trailing"
repair = "delete"
source = "seed"

# --------------------------------------------------------------------
# Substitution pairs (matched span replaced with a fixed, plain-register
# string). Every replacement token below is attested in the TRAIN human
# corpus itself (spot-checked by grep at curation time, counts in
# `notes` where the pair is curated-seed rather than seed).
# --------------------------------------------------------------------

[[substitution_pairs]]
id = "sub.crucial_for"
pattern = '(?i)\bcrucial for\b'
replacement = "important for"
repair = "substitute"
source = "mined-paired"
notes = """
Mined via corpus-tool mine-paired (topic-cancelled by construction: \
stock and antislop answer the identical prompt under the identical \
derived seed). Paired-corpus counts: "crucial for" 2-gram stock=15, \
antislop=3, score=4.6514, human_train_count=1; the tighter 3-gram \
"is crucial for" (covered by this same pattern) stock=9, antislop=1, \
score=6.9534, human_train_count=0. Spread across all five paired \
genres (blog/docs/email/forum/readme), not one prompt's topic - "is \
crucial for" alone appears in the mining pipeline's own top ranks with \
0 human-train occurrences, and mine-inventory's separate machine-vs- \
human pass over the general corpus never surfaced this phrase at all \
(only a single, thin "a crucial task to" candidate, n=1) - exactly the \
genuinely-stylistic-but-topic-diluted case mine-paired exists to catch. \
Replacement "important for" is attested 9 times in the human train \
corpus (grep-verified) as a plain intro-framing phrase, the same \
register slot. Paired with sub.is_crucial below for the "is crucial" \
form without a following "for".
"""

[[substitution_pairs]]
id = "sub.delve_into"
pattern = '(?i)\bdelve into\b'
replacement = "cover"
repair = "substitute"
source = "curated-seed"
notes = """
Frontier phrase, general form. Train-split measured counts: \
count_M=5, count_H=0 for "delve into" itself; the constituent word \
"delve" occurs 0 times anywhere in the 264-doc train human corpus \
(286 occurrences of "into" alone, so it is "delve" that fails the \
gate, not the phrase's frequency generally). Below every literal \
n-gram mining threshold on this corpus (needs human-token-freq >= 25 \
for every constituent word; "delve" has 0). Replacement token "cover" \
is attested in the human train corpus 9 times as an intro-framing verb \
(e.g. "this guide covers the steps required", "this document will \
cover general methods", grep-verified), the same slot already used by \
this pack's own sub.will_walk_you_through entry.

Paired-mining cross-check (corpus-tool mine-paired, corpus/paired/, 55 \
pairs): "delve into" appears once, on the stock side only (1 stock / 0 \
antislop / 0 human_train), directionally consistent but nowhere near \
any threshold in a 110-doc corpus - paired mining does NOT confirm this \
phrase with real counts; it remains curated-seed on the strength of the \
train-split measurement above.
"""

[[substitution_pairs]]
id = "sub.in_order_to"
pattern = '(?i)\bin order to\b'
replacement = "to"
repair = "substitute"
source = "seed"

[[substitution_pairs]]
id = "sub.is_crucial"
pattern = '(?i)\bis crucial\b'
replacement = "matters"
repair = "substitute"
source = "mined-paired"
notes = """
Mined via corpus-tool mine-paired (topic-cancelled - see sub.crucial_for \
above for the shared methodology note). Paired-corpus counts: "is \
crucial" 2-gram stock=16, antislop=8, score=2.0050, human_train_count=1; \
the more specific 3-gram "this is crucial" (also covered by this \
pattern) stock=8, antislop=2, score=3.6246, human_train_count=0. Spread \
across all five paired genres, matching the same "crucial" intensifier \
mined-ngrams-v1.toml already flags at the single-word level (z=6.4922) \
but which mine-inventory's phrase-level tables never surfaced (not one \
"crucial for"/"is crucial" 2-/3-gram appears anywhere in \
corpus/MINE_INVENTORY.md). Replacement "matters" occurs 12 times in the \
human train corpus (grep-verified, excluding Title-Case "X Matters" \
event-name false positives), but only 8 of those 12 are the plain \
predicate-verb sense this substitution needs ("this matters", "order \
matters", "your contribution matters", "why and how this matters"); the \
other 4 are the unrelated noun sense "matters of X" / "such matters" \
(e.g. "the exultation of...secondary matters of conduct", "in matters \
of hygiene; notably such matters", "that opens other matters") and do \
not support the verb-slot claim. 8 verb-sense attestations in the same \
declarative slot is still the evidence relied on here. If a matched \
span also contains a trailing "for" \
(e.g. "is crucial for X"), sub.crucial_for's own pattern also matches \
that span - the same specific/general overlap already accepted by this \
pack's sub.delve_into / sub.we_will_delve_into pair; either order of \
application produces a fluent result.
"""

[[substitution_pairs]]
id = "sub.leverage_3sg"
pattern = '(?i)\bleverages\b'
replacement = "uses"
repair = "substitute"
source = "seed"
notes = """
Split from the seed's single `\\bleverages?\\b -> "uses"` entry, whose \
invariant replacement broke subject-verb agreement on base-form \
matches ("you can leverage" -> "you can uses"). Form-matched pair with \
sub.leverage_base.
"""

[[substitution_pairs]]
id = "sub.leverage_base"
pattern = '(?i)\bleverage\b'
replacement = "use"
repair = "substitute"
source = "seed"
notes = "Base-form half of the sub.leverage_3sg split; see that entry."

[[substitution_pairs]]
id = "sub.our_development_journey"
pattern = '(?i)\bour development journey\b'
replacement = "development"
repair = "substitute"
source = "curated-seed"
notes = """
Frontier phrase. Train-split measured counts: count_M=1, count_H=0 for \
the full 3-gram "our development journey"; the constituent word \
"journey" occurs 9 times in the 264-doc train human corpus, below the \
>=25 human-token-frequency gate, so the phrase never reaches the \
literal-mining tables despite "our development" alone scoring as the \
#28 machine-favored 2-gram (13 machine / 0 human, score 67.03, visible \
in corpus/MINE_INVENTORY.md). Strips the ritual "our ... journey" \
wrapper and keeps the real content noun, mirroring this pack's own \
span.simply hedge-stripping pattern. Replacement token "development" \
is attested 100 times in the train human corpus as a plain content \
noun (grep-verified).

Paired-mining cross-check (corpus-tool mine-paired, corpus/paired/, 55 \
pairs): "our development journey" appears 0 times on either side (0 \
stock / 0 antislop / 0 human_train) - paired mining does NOT confirm \
this phrase; a 110-doc corpus is simply too small to expect a 3-word \
phrase this specific to recur even once. It remains curated-seed on the \
strength of the train-split measurement above.
"""

[[substitution_pairs]]
id = "sub.prior_to"
pattern = '(?i)\bprior to\b'
replacement = "before"
repair = "substitute"
source = "seed"

[[substitution_pairs]]
id = "sub.this_guide_will_walk_you_through"
pattern = '(?i)\bthis guide will walk you through\b'
replacement = "this guide covers"
repair = "substitute"
source = "seed"

[[substitution_pairs]]
id = "sub.utilize_3sg"
pattern = '(?i)\butilizes\b'
replacement = "uses"
repair = "substitute"
source = "seed"
notes = """
Split from the seed's single `\\butilizes?\\b -> "uses"` entry, whose \
invariant replacement broke subject-verb agreement on base-form \
matches ("you can utilize" -> "you can uses"). Form-matched pair with \
sub.utilize_base.
"""

[[substitution_pairs]]
id = "sub.utilize_base"
pattern = '(?i)\butilize\b'
replacement = "use"
repair = "substitute"
source = "seed"
notes = "Base-form half of the sub.utilize_3sg split; see that entry."

[[substitution_pairs]]
id = "sub.we_will_delve_into"
pattern = "(?i)\\bwe'?ll delve into\\b"
replacement = "we cover"
repair = "substitute"
source = "curated-seed"
notes = """
Frontier phrase, specific form (paired with the general sub.delve_into \
fallback below it in id order, the same specific-then-general pairing \
already used by sub.this_guide_will_walk_you_through / \
sub.will_walk_you_through). Train-split measured counts: count_M=3, \
count_H=0 for "we'll delve into" / "we will delve into" combined. \
Replacement "we cover" keeps the pronoun instead of dropping it, since \
"Cover the setup process" reads as an imperative while the source \
sentence is declarative ("We'll delve into the setup process").

Paired-mining cross-check (corpus-tool mine-paired, corpus/paired/, 55 \
pairs): "we'll delve into" / "we will delve into" appears 0 times on \
either side - paired mining does NOT confirm this phrase with real \
counts. It remains curated-seed on the strength of the train-split \
measurement above.
"""

[[substitution_pairs]]
id = "sub.will_walk_you_through"
pattern = '(?i)\bwill walk you through\b'
replacement = "covers"
repair = "substitute"
source = "seed"

# --------------------------------------------------------------------
# Whole-sentence ritual frames (deleted whole, or - for the one
# diagnostic-only entry - recorded without a rewrite because none is
# safe).
# --------------------------------------------------------------------

[[ritual_frames]]
id = "ritual.congratulations_open"
pattern = "(?i)^congratulations"
scope = "sentence"
repair = "delete"
source = "seed"

[[ritual_frames]]
id = "ritual.fortunate_enough_to_have_had_the_opportunity_to"
pattern = '(?i)fortunate enough to have had the opportunity to'
scope = "sentence"
repair = "diagnostic_only"
source = "curated-seed"
notes = """
Frontier phrase. Train-split measured counts: count_M=1, count_H=0. \
Every constituent rare word ("fortunate": 2 human occurrences, \
"opportunity": 23, both under the >=25 gate) keeps this off every \
literal-mining table. No safe closed-set rewrite was identified:
collapsing it correctly means inheriting tense onto an embedded \
infinitive complement, which is structurally similar to a pivot but is \
not an LVC (no light verb, no nominalization) and isn't covered by any \
of the four repair operations this pack's other families use. Shipped \
diagnostic-only (repair = "diagnostic_only"): recorded so the pack's \
own history is legible, but must not be executed as a rewrite. Once a \
DMS automaton (see dms-index-v1.toml / friction_packs::dms) is wired \
into detection, a phrase this long and distinctive is exactly the kind \
of span differential matching statistics will flag without needing a \
literal entry at all - that wiring is out of scope this milestone.

Paired-mining cross-check (corpus-tool mine-paired, corpus/paired/, 55 \
pairs): "fortunate enough to have had the opportunity to" appears 0 \
times on either side - paired mining does NOT confirm this phrase with \
real counts. It remains curated-seed, diagnostic-only, on the strength \
of the train-split measurement above.
"""

[[ritual_frames]]
id = "ritual.happy_verbing_open"
pattern = '(?i)^happy \w+ing'
scope = "sentence"
repair = "delete"
source = "seed"

[[ritual_frames]]
id = "ritual.hope_this_email_finds_you_well"
pattern = '(?i)\bi hope this (email|message) finds you well\b'
scope = "sentence"
repair = "delete"
source = "mined"
train_machine_count = 16
train_human_count = 0
notes = """
Classic LLM email/message-opener tic. The tighter phrase above is a \
curator-refined regex measured directly against the train corpus (16 \
machine occurrences, 0 human); the constituent literal-mining tables in \
corpus/MINE_INVENTORY.md independently show "this email" as the #3 \
machine-favored 2-gram (27/0, score 137.07) and "hope this email" as a \
gated-passing machine-favored 3-gram (12/0, score 60.17) - both formal- \
gate passes, not raw/ungated counts.
"""

[[ritual_frames]]
id = "ritual.if_you_have_questions"
pattern = '(?i)if you have any questions.{0,60}(reach out|contact|let us know)'
scope = "sentence"
repair = "delete"
source = "seed"

[[ritual_frames]]
id = "ritual.let_me_know_if_you_would_like"
pattern = "(?i)\\blet me know if you(?:['’]d like|\\s+would like)\\b"
scope = "sentence"
repair = "delete"
source = "mined-paired"
train_stock_count = 9
train_antislop_count = 1
train_human_count = 0
notes = """
Assistant-voice closing continuation offer ("Let me know if you'd like \
any refinements/adjustments/modifications!") - the same family as this \
pack's own ritual.would_you_like_me_to_elaborate, mined via corpus-tool \
mine-paired instead of mine-inventory (topic-cancelled by construction: \
stock and antislop answer the identical prompt under the identical \
derived seed - see sub.crucial_for's notes for the shared methodology). \
The raw gated 3-gram "me know if" stock=11, antislop=3, score=3.4723, \
human_train_count=1 (corpus/MINE_PAIRED.md) is broader than the actual \
tell: the bare phrase "let me know if" also covers ordinary human \
continuation requests with no chatbot register at all (e.g. \
corpus/quarantine/forum/a53feca0624ff561.md, a human/train doc: "Good \
luck, and please let me know if you find that \"magic bullet.\""), which \
a sentence-deleting rule on the unanchored phrase would wrongly strip \
from genuine human text. Narrowed here, the same way \
ritual.would_you_like_me_to_elaborate narrows its own raw n-gram, to the \
specific continuation-offer construction ("let me know if you'd like" / \
"let me know if you would like") that the id names. Curator-refined \
regex measured directly against corpus/paired/: stock=9, antislop=1, \
spread across blog/email/forum (not one prompt's topic); human_train=0 \
across the full human+quarantine train corpus (the one human hit above \
does not match the narrowed continuation form). mine-inventory's \
separate machine-vs-human pass over the general corpus only ever \
surfaced a single, thin "let me know if" candidate (n=1, below every \
formal gate) - the same diluted-by-topic-pooling case sub.crucial_for's \
notes describe.
"""

[[ritual_frames]]
id = "ritual.please_replace_bracketed_placeholders"
pattern = '(?i)(please )?replace the bracketed placeholders[^.\n]*'
scope = "sentence"
repair = "delete"
source = "mined"
train_machine_count = 4
train_human_count = 0
notes = """
README-template placeholder instruction leaking verbatim into the \
generated document (e.g. "Please replace the bracketed placeholders \
with specific details relevant to your project") - unambiguous \
machine-register meta-text, not topic content, but a thin count (n=4) \
that falls below the formal literal-mining gate because "bracketed" \
and "placeholders" are too rare in the human corpus to clear the \
per-token human-frequency threshold (the same reason the gate excludes \
genuinely-rare topic words; here the rarity is incidental to how \
distinctive the tell is, not evidence against it). Surfaced only in the \
block-position pass's raw, ungated closing-frame counts \
(corpus/MINE_INVENTORY.md's "Ritual/closing frame" section), which \
exists precisely so a curator can judge cases like this on raw counts. \
Admitted on the strength of 0/4 human/machine separation and the \
unmistakable nature of the tell, despite the low count; flagged here \
for a future re-check once more train data exists.
"""

[[ritual_frames]]
id = "ritual.we_hope"
pattern = "(?i)we hope (this|you)"
scope = "sentence"
repair = "delete"
source = "seed"

[[ritual_frames]]
id = "ritual.would_you_like_me_to_elaborate"
pattern = '(?i)would you like me to \w+'
scope = "sentence"
repair = "delete"
source = "mined"
train_machine_count = 9
train_human_count = 0
notes = """
Assistant-voice continuation offer ("Would you like me to elaborate on \
any specific aspect...?") - a distinctive completion/chat-register tic \
that has no place in a finished document. The tighter phrase above is a \
curator-refined regex measured directly (9 machine, 0 human); the \
formally-gated literal 4-gram tables independently show "would you like \
me" and "you like me to" each at 11/0 (min_machine_count_n4=4, passing \
the gate cleanly), and the 3-gram "like me to" at 11/0 as well.
"""

