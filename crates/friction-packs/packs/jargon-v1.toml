# jargon-v1 pack: curated metaphor lexemes for the friction-match
# jargon.metaphor channel (SYNTHESIS.md §4). Detection-only — there is no
# deterministic true replacement for an invented term, so this pack
# carries no repair machinery at all, just the lexeme list and a small
# attested-exceptions allowlist.
#
# V1 detects one narrow, high-precision shape: a curated metaphor noun
# borrowed from a physical/aesthetic domain, sitting in the HEAD position
# of a noun compound ("semantic wells", "cross-domain resonance"). The
# broader attestation-table design (weirdness ratio over web-scale
# n-gram counts, not a curated list) is future work — see SYNTHESIS.md
# §4 and §5.
#
# `source` on every `[[lexemes]]` entry is one of:
#   "mined"     - measured directly against this corpus (train split);
#                 `notes` records the per-100k-word llm vs human rate.
#   "external"  - documented LLM metaphor vocabulary from a source
#                 external to this corpus (antislop-sampler / Wikipedia
#                 "Signs of AI writing" lists cited in
#                 docs/research/FRONTIER_MODELS.md §3.4); near-zero in
#                 both corpus classes here, so this corpus alone can't
#                 confirm them the way the "mined" entries are confirmed.
#
# Explicitly EXCLUDED (considered and rejected, not merely unconsidered):
# echo (human-favored 3.16 vs 0.45 per 100k words — it is a shell
# command, not a metaphor, in this corpus's technical-documentation
# register), landscape (human-favored 5.27 vs machine), garden, sea/
# ocean, journey ("user journey" is real UX terminology), dance, pulse,
# storm, river, art, music, magic — each either mined human-favored on
# this corpus or a real-terminology collision that would cost precision.
#
# `attested_exceptions` are exact compounds (lowercased, hyphens
# normalized to spaces) the jargon.metaphor channel never flags
# regardless of head/modifier shape, each with its own reason in `notes`.
# Kept deliberately small.

[pack]
version = "jargon-v1"

