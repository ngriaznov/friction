# --------------------------------------------------------------------
# Attested exceptions: exact compounds never flagged.
# --------------------------------------------------------------------

[[attested_exceptions]]
compound = "data fabric"
notes = "Established industry term (a data-integration architecture pattern), not a metaphor coinage."

[[attested_exceptions]]
compound = "service fabric"
notes = "Product-adjacent, established (Azure Service Fabric and the general distributed-systems sense predate LLM prose)."

[[attested_exceptions]]
compound = "resonance frequency"
notes = "Physics: the frequency at which a system oscillates with maximum amplitude."

[[attested_exceptions]]
compound = "resonant frequency"
notes = "Physics: adjectival form of resonance frequency."

[[attested_exceptions]]
compound = "wave resonance"
notes = "Physics: resonance between coupled waves."

[[attested_exceptions]]
compound = "oil well"
notes = "Literal well (a drilled shaft), not the metaphor sense."

[[attested_exceptions]]
compound = "water well"
notes = "Literal well (a drilled or dug shaft), not the metaphor sense."

[[attested_exceptions]]
compound = "test well"
notes = "Literal well (an exploratory drilled shaft), not the metaphor sense."

[[attested_exceptions]]
compound = "primordial soup"
notes = "Established idiom in CS/biology contexts (the origin-of-life hypothesis, and its computing-metaphor derivatives), not a coinage."

[[attested_exceptions]]
compound = "color harmony"
notes = "Established design term (a color-theory relationship), not a metaphor coinage."

[[attested_exceptions]]
compound = "tile mosaic"
notes = "Literal sense: the physical/optical tiled pattern (e.g. a camera sensor's color-filter array, or a literal tiled surface), not a metaphor coinage. Found by a full-corpus precision sweep (beyond the pinned snapshot sample) flagging a real human StackExchange forum post describing a camera demosaicing filter pattern."

[[attested_exceptions]]
compound = "hot soup"
notes = "Literal food, not the metaphor sense \"topical soup\"/\"information soup\" this pack targets. Found by a full-corpus precision sweep (beyond the pinned snapshot sample) flagging a real human StackExchange forum post about food safety. \"Soup\" as an ordinary food noun remains a residual false-positive risk for other common food-soup phrases this small, honest exception list does not enumerate (\"chicken soup\", \"canned soup\", etc.) — narrowing further would need either a broader curated exception list or a food-noun guard, out of scope for this pass."
