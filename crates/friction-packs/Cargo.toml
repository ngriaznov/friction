[package]
name = "friction-packs"
version = "0.1.0"
description = "Versioned, audited data packs: tell inventory, attestation tables, register bands."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["embedded-dms"]
## Embeds the derived DMS automaton artifact (`packs/dms-index-en-v1.bin`,
## 27 MB — this crate's single largest embedded pack) as an `include_bytes!`
## static, exactly as this crate has always done. On by default — every
## native build keeps this on. A wasm build turns it off and calls
## `install_dms_index_bin`/`install_dms_index_toml` at runtime instead, so
## the index ships as a separate fetch rather than bloating every page
## load's binary. With this feature off and no install call made,
## `DMS`/`PackSet` panics rather than silently running with no DMS index.
embedded-dms = []

[dependencies]
# Only for `Envelope`, the `[lo, hi]` band type `EnvelopePack::band`
# returns — this crate performs no parsing, NLP, or metric computation of
# its own.
friction-core = { path = "../friction-core" }
# `InventoryPack::parse` checks every `lvc_pairs` entry against
# `friction_nlp::lvc::DERIVATIONAL_LEXICON`/`LIGHT_VERBS` — acyclic
# (friction-nlp does not depend on this crate). `default-features = false`:
# this crate only ever touches those two always-compiled lexicon statics,
# never anything gated by friction-nlp's `embedded-weights` feature, so
# there is nothing to forward here — this edge simply stops being one of
# the (redundant, for a native build) requesters of that feature, which
# matters for a wasm build's dependency closure (see friction-wasm's own
# Cargo.toml) where no *other* edge into friction-nlp must request it.
friction-nlp = { path = "../friction-nlp", default-features = false }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# `jargon_attest`'s `BinaryFuse8`/`BinaryFuse8Ref` — see that module's own
# docs for why construction (`corpus-tool jargon-attest`, via
# `build_pack_bytes`) and lookup (`JARGON_ATTEST`, via `from_dma`/
# `DmaSerializable`) both live in this one crate rather than splitting the
# dependency across this crate and `corpus-tool`.
xorf = { workspace = true }
# `jargon_attest`'s fixed-seed key hash — see that module's own docs for
# why a seeded, non-cryptographic hash (not std's randomized `SipHash`) is
# required for a byte-reproducible filter.
xxhash-rust = { workspace = true }
# Not yet in [workspace.dependencies]; added directly here per this
# workspace's existing crate-local convention (see friction-harness's own
# Cargo.toml, which needs this same crate for the same seed-pattern
# tables this crate's inventory pack now owns instead).
regex = "1"
# `pooled_attest`'s safe `&[u16] -> &[u8]` view for
# `BinaryFuse16Ref::from_dma`'s alignment requirement — see the workspace
# root's own comment on this dependency for why it's needed at all.
zerocopy = { workspace = true }
# `InventoryPack::parse` compiles its ~31 patterns in parallel (regex
# construction is the pack's whole startup cost. See that function's
# docs). Ordered `par_iter().collect()` only, per the workspace
# determinism doctrine.
rayon = { workspace = true }
