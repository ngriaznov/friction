[package]
name = "friction-packs"
version = "0.1.0"
description = "Versioned, audited data packs: tell inventory, attestation tables, register bands."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Only for `Envelope`, the `[lo, hi]` band type `EnvelopePack::band`
# returns — this crate performs no parsing, NLP, or metric computation of
# its own.
friction-core = { path = "../friction-core" }
# `InventoryPack::parse` checks every `lvc_pairs` entry against
# `friction_nlp::lvc::DERIVATIONAL_LEXICON`/`LIGHT_VERBS` — acyclic
# (friction-nlp does not depend on this crate).
friction-nlp = { path = "../friction-nlp" }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
# `jargon_attest`'s `BinaryFuse8`/`BinaryFuse8Ref` — see that module's own
# docs for why construction (`corpus-tool jargon-attest`, via
# `build_pack_bytes`) and lookup (`JARGON_ATTEST`, via `from_dma`/
# `DmaSerializable`) both live in this one crate rather than splitting the
# dependency across this crate and `corpus-tool`.
xorf = { workspace = true }
# `jargon_attest`'s fixed-seed key hash — see that module's own docs for
# why a seeded, non-cryptographic hash (not std's randomized `SipHash`) is
# required for a byte-reproducible filter.
xxhash-rust = { workspace = true }
# Not yet in [workspace.dependencies]; added directly here per this
# workspace's existing crate-local convention (see friction-harness's own
# Cargo.toml, which needs this same crate for the same seed-pattern
# tables this crate's inventory pack now owns instead).
regex = "1"
