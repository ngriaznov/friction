[package]
name = "friction-metrics"
version = "0.1.0"
description = "Document-level register diagnostics reported by `friction check`."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## Forwards to `friction-nlp/embedded-weights`, restoring that crate's own
## default (this edge below sets `default-features = false` so a wasm
## build's dependency closure — see friction-wasm's own Cargo.toml — can
## turn the embedded weights off by disabling *this* crate's default too;
## every existing caller (friction-cli, corpus-tool, this crate's own
## tests) still gets its default feature set activated implicitly, so
## nothing changes for them.
default = ["friction-nlp/embedded-weights"]

[dependencies]
friction-core = { path = "../friction-core" }
friction-nlp = { path = "../friction-nlp", default-features = false }
# Not yet in [workspace.dependencies]; added directly here (rather than at
# the workspace root) to avoid a concurrent root-file edit while sibling
# metric modules are being written in parallel. Already present in
# Cargo.lock as a transitive dependency, so this adds no new crate to the
# build.
regex = "1"
# Both already in `[workspace.dependencies]`: used only to parse the
# embedded `mined-ngrams-en-v1.toml` pack at process start (see
# src/signals.rs) into the curated llm-/human-favored phrase lists.
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
friction-parse = { path = "../friction-parse" }
