[package]
name = "friction-nlp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## Enables `OnnxParser`, an `ort`-backed `DepParser` implementation. Off by
## default: the heuristic parser needs no model and no C/ONNX toolchain, and
## as of this writing no pinned dependency-parser model is registered in
## `friction-packs` for this feature to load (see `dep_onnx`'s module docs).
onnx = ["dep:ort"]
## Off by default: pulls in an LGPLv2.1-licensed model binary (LanguageTool
## v5.2 data via the `nlprule` crate — see src/tag_nlprule.rs's module docs
## and weights/NOTICE.md for the perceptron tagger's own, clean, sourcing).
## Exists only as an offline comparison backend; never the shipped default.
nlprule = ["dep:nlprule", "dep:rayon"]
## Exposes the training-support helpers `examples/train_perceptron.rs`
## needs (feature extraction + weight-table save, tab-separated gold-file
## parsing). Off by default so normal builds don't carry training code as
## part of their public surface.
train-tooling = []

[dependencies]
friction-core = { path = "../friction-core" }
thiserror = { workspace = true }

# Pinned to the exact version verified to build cleanly on this workspace's
# toolchain/edition (rustc 1.96, edition 2024, resolver 3); not yet covered
# by [workspace.dependencies] (see the friction-nlp task brief) — added here
# rather than at the workspace root to avoid a concurrent root-file edit.
# Default features (`std`, `api-17`, `download-binaries`) are kept: the last
# fetches a sha256-verified ONNX Runtime build into OUT_DIR at build time,
# matching this workspace's offline-at-lint-time / downloads-only-at-build-
# time discipline rather than downloading anything at `check`/`fix` time.
ort = { version = "2.0.0-rc.12", optional = true }
# `from_xml` pulls in serde + serde-xml-rs to parse the vendored SRX
# ruleset at process start; the ruleset itself is embedded via
# `include_str!` (see src/segment_srx.rs), so no file or network I/O
# happens at build or run time.
srx = { version = "0.1.4", features = ["from_xml"] }
# --- tagging/inflection deps (owned by the tagging agent; see src/tag.rs,
# src/tag_perceptron.rs, src/tag_nlprule.rs, src/inflect.rs) ---
# Optional: only the `nlprule` comparison backend needs these — see the
# `nlprule` feature above.
nlprule = { version = "0.6.4", optional = true }
rayon = { version = "1", optional = true }
# Moved from [build-dependencies]: also needed at *runtime* now, to
# decompress the vendored perceptron weight artifact once at load time.
flate2 = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# build.rs downloads + sha256-verifies the nlprule English tagger model at
# build time (never at runtime), only when the `nlprule` feature is on —
# see build.rs's own doc comment.
ureq = { workspace = true }
sha2 = { workspace = true }
flate2 = "1"

[[example]]
name = "train_perceptron"
required-features = ["train-tooling"]

[dev-dependencies]
friction-parse = { path = "../friction-parse" }
# Golden sentence-segmentation fixtures (tests/data/segment_golden.toml)
# are TOML for readability; parsed with these two at test time only.
toml = { workspace = true }
serde = { workspace = true }
# Hashes the parse -> segment -> tag token stream for the corpus
# determinism check (tests/corpus_determinism.rs).
sha2 = { workspace = true }
# tests/perceptron_parity.rs (gated behind the `nlprule` feature) drives
# the real accept/reject verdict logic (`pivot::match_pivot`,
# `fragment::fragment_rate`) with each tagger in turn. A dev-dependency
# on a crate that itself depends on this one's library target is not a
# cycle: Cargo builds this crate's `lib` first, then `friction-harness`
# (against that already-built `lib`), then this crate's own test
# binaries (against both) — the cycle only exists at the dev-dependency
# level, which Cargo's build graph does not consider a normal-dependency
# cycle at all.
friction-harness = { path = "../friction-harness" }
