[package]
name = "friction-nlp"
version = "0.1.0"
description = "Sentence segmentation, part-of-speech tagging, and dependency parsing, from vendored weights."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## Exposes the training-support helpers `examples/train_perceptron.rs`
## needs (feature extraction + weight-table save, tab-separated gold-file
## parsing). Off by default so normal builds don't carry training code as
## part of their public surface.
train-tooling = []

[dependencies]
friction-core = { path = "../friction-core" }
thiserror = { workspace = true }

# Pinned to the exact version verified to build cleanly on this workspace's
# toolchain/edition (rustc 1.96, edition 2024, resolver 3); not yet covered
# by [workspace.dependencies] (see the friction-nlp task brief) — added here
# rather than at the workspace root to avoid a concurrent root-file edit.
# Default features (`std`, `api-17`, `download-binaries`) are kept: the last
# fetches a sha256-verified ONNX Runtime build into OUT_DIR at build time,
# `from_xml` pulls in serde + serde-xml-rs to parse the vendored SRX
# ruleset at process start; the ruleset itself is embedded via
# `include_str!` (see src/segment_srx.rs), so no file or network I/O
# happens at build or run time.
srx = { version = "0.1.4", features = ["from_xml"] }
# --- tagging/inflection deps (see src/tag.rs, src/tag_perceptron.rs,
# src/inflect.rs) ---
# Decompresses the vendored perceptron weight artifact once at load time.
flate2 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# Encodes/decodes the derived `.bin` weight artifacts (`weights_bin`
# module): a compact binary `serde` format, much faster to parse than
# `serde_json` (no text scanning, no `HashMap`/`String` allocation per
# key) since it reads straight through a byte slice. `default-features =
# false` + `alloc` drops `heapless`/`heapless-cas` (this crate always has
# `std`'s allocator, has no embedded-target reason to prefer a fixed-
# capacity buffer) and needs no `postcard-derive`, `crc`, or `defmt` —
# `to_allocvec`/`from_bytes` are both available under plain `alloc`.
postcard = { version = "1", default-features = false, features = ["alloc"] }

[[example]]
name = "train_perceptron"
required-features = ["train-tooling"]

[[example]]
name = "eval_perceptron"
required-features = ["train-tooling"]

[[example]]
name = "train_parser"
required-features = ["train-tooling"]

[dev-dependencies]
friction-parse = { path = "../friction-parse" }
# Golden sentence-segmentation fixtures (tests/data/segment_golden.toml)
# are TOML for readability; parsed with these two at test time only.
toml = { workspace = true }
serde = { workspace = true }
# Hashes the parse -> segment -> tag token stream for the corpus
# determinism check (tests/corpus_determinism.rs).
sha2 = { workspace = true }
