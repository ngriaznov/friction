[package]
name = "friction-core"
version = "0.1.0"
description = "Byte-exact spans, patches, and findings shared by the friction engine."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## Enables `serde::Serialize`/`Deserialize` on `MetricVector` and `Envelope`
## so `friction-packs` can (de)serialize envelope bands to/from TOML.
serde = ["dep:serde"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
# Dev-only: `token_class`'s tests build the shared class fragments into
# real `Regex`es, the way every real consumer does, to prove the
# fragments compile and behave as documented. The shipped crate stays
# regex-free — see that module's docs.
regex = "1"
