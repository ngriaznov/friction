[package]
name = "friction-match"
version = "0.1.0"
description = "Detection of machine-register spans by literal inventory, tag pattern, and matching statistics."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
## Forwards to `friction-nlp/embedded-weights` and
## `friction-packs/embedded-dms` — see friction-metrics' Cargo.toml for
## why this exists (same wasm-dependency-closure reason). This crate's
## own code never branches on either feature; it only carries the two
## edges below.
default = ["friction-nlp/embedded-weights", "friction-packs/embedded-dms"]

[dependencies]
friction-core = { path = "../friction-core" }
friction-parse = { path = "../friction-parse" }
friction-nlp = { path = "../friction-nlp", default-features = false }
friction-packs = { path = "../friction-packs", default-features = false }
aho-corasick = { workspace = true }
regex = "1"
thiserror = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
# Fixture reuse (docs/research/fixtures.json, sample docs) and the pinned
# tokenize-convention equivalence test only — a dev-dependency back-edge,
# not a build-graph cycle (friction-harness's own deps do not include this
# crate).
friction-harness = { path = "../friction-harness" }
proptest = { workspace = true }
